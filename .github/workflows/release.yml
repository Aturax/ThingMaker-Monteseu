# Builds ThingMaker for macOS (one universal app, Intel and Apple silicon) and
# Windows when a version tag is pushed, signs the update bundles with the
# updater key, and leaves a draft release with `latest.json` for the app's
# updater. Publishing the draft is what rolls the update out. The draft is
# made first, once; both builds upload to it.
#
# Needs two repository secrets (docs/release.md): TAURI_SIGNING_PRIVATE_KEY
# and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The draft release is made once, before the builds: each build creating it
  # raced the other, and the one that lost failed after a full build.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      notes: ${{ steps.release.outputs.notes }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A re-run finds the draft it made the first time.
          id=$(gh api "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
          if [ -z "$id" ]; then
            gh release create "$TAG" --draft --verify-tag --title "ThingMaker $TAG" --notes "Install it from the files below, or update from inside ThingMaker."
            id=$(gh api "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          # The draft's notes (written before the tag is pushed, or the
          # default above) are what the updater shows: latest.json carries them.
          {
            echo "notes<<THINGMAKER_NOTES"
            gh api "repos/$GH_REPO/releases/$id" --jq .body
            echo "THINGMAKER_NOTES"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --config src-tauri/tauri.release.conf.json
          - platform: windows-latest
            rust_targets: ""
            args: --target x86_64-pc-windows-msvc --config src-tauri/tauri.release.conf.json
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          # sherpa-onnx-sys prefers files from target/ over its archive directory.
          prefix-key: verified-native-v1
          cache-targets: false

      - name: Verify native voice runtimes
        shell: pwsh
        run: |
          $archives = Join-Path $env:RUNNER_TEMP "verified-sherpa"
          python scripts/fetch-sherpa.py $archives
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SHERPA_ONNX_ARCHIVE_DIR=$archives" >> $env:GITHUB_ENV
          if (Test-Path target) { throw "Expected a fresh Cargo target directory" }
          if ($IsWindows) {
            # Tauri's default linker override forces the dynamic UCRT. Cargo sets the full CRT below.
            "STATIC_VCRUNTIME=false" >> $env:GITHUB_ENV
            "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-Ctarget-feature=+crt-static" >> $env:GITHUB_ENV
          }

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseBody: ${{ needs.create-release.outputs.notes }}
          args: ${{ matrix.args }}

      - name: Report installer size
        shell: pwsh
        run: |
          $pattern = if ($IsWindows) { "*-setup.exe" } else { "*.dmg" }
          $installers = @(Get-ChildItem target -Recurse -File -Filter $pattern | Where-Object { $_.Directory.Name -in "nsis","dmg" })
          if (!$installers) { throw "Installer missing from bundle output" }
          foreach ($installer in $installers) {
            "- $($installer.Name) — $($installer.Length) bytes" >> $env:GITHUB_STEP_SUMMARY
          }
